<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>formulario HTML</h1>

    <div class="formulario">
        <form action="recebe.html" > <!-- action é atributo que define para onde os dados devem ser enviados, quando o botão do formulário for clicado. Os metodos de envio são GET e POST, o metodo GET é usado para enviar dados atraves da URL, esnquanto o metodo POST é usado para enviar dados através do corpo da requisição HTTP. O metodo padrão é GET, esses metodos são utilizados junto da linguagem de programação do lado do servidor, como JavaScript, PHP, Python, etc. -->
            <label for="id_nome"> <!--Label é o elemento que fica acima do imput, o label define o que deve ser escrito-->
                Nome:
            </label>
            <br>
            <input type="text" id="id_nome" name="lnome" valume="">  <!-- input é onde os dados  serão digitados-->
            <br><br>

            <label for="id_senha"> <!-- o for é usado para direcionar ao elemento imput, ou seja, quando eu clicar no label senha eu vou para o campo de direção da senha-->
                Senha:
            </label>
            <br>
            <input type="password" id="id_senha" name="lsenha" value="">
            <!-- type é o tipo de dados que vai ser digitado no campo imput, id é o identificados do campo, name é o nome do campo, value é o valor do campo-->
             <br><br>
         <input type="submit" valume="Enviar"> <!-- o type submit é um botão que envia os dados do formulário para o servidor-->

        </form>
        <br> <br>

        <form action="">
         <input type="radio" id="azul" name="cor" value="Azul"> <!--o type radio é usado para criar opções de escolha, o atributo name define os grupos de opções, ou seja, as opções que possuesm o mesmo name fazem parte do mesmo gupo, apenas uma opção pode ser selecionada dentro do grupo--> 
           <label for="azul"> Azul</label>
           <br>
           <input type="radio" id="vermelho" name="cor" value="Vermelho">
           <label for="vermelho"> Vermelho</label>
           <br>
           <input type="radio" id="verde" name="cor" value="verde">
           <label for="verde"> Verde</label>





        </form>

        <br> <br>
        <form action="">

            <input type="checkbox" id="esporte1" name="espoerte1" value="futebol"> <!-- o type checkbox é usado para criar opções de escolha assim como o radio, a diferença é que o checkbox permite selecionar mais de uma opção ao mesmo tempo-->
            <label for="esporte1">Futebol</label>
            <br>
            <input type="checkbox" id="esporte2" name="espoerte2" value="volei">
            <label for="esporte1">Volei</label>
            <br>
            <input type="checkbox" id="esporte3" name="espoerte3" value="ciclismo">
            <label for="esporte1">Ciclismo</label>
            <br>
            



        </form>
    </div>
    </div>
    
</body>
</html>
